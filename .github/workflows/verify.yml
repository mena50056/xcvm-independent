name: Verify independent packaging
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 deployment/test_packaging.py
      - run: python3 -m compileall -q deployment
      - run: bash -n deployment/setup.sh
      - run: php -l deployment/provision-main.php && php -l deployment/enroll-node.php && php -l runtime/LocalCore.php
      - run: XCVM_LAB_STATE="$RUNNER_TEMP/xcvm-independent-lab/policy" php tests/deployment-policy.php

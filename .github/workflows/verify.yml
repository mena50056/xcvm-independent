name: Verify independent packaging
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  horus-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check panel/src/Public/assets/admin/xcvm/console-native.js
      - run: node panel/tests/Support/horus-firstpaint.mjs
      - run: node --check panel/src/Public/assets/admin/xcvm/horus-movies.js
      - run: node panel/tests/Support/horus-movies.mjs
      - run: php panel/tests/Support/horus-movies.php
      - run: node --check panel/src/Public/assets/admin/xcvm/horus-subscriptions.js
      - run: node panel/tests/Support/horus-subscriptions.mjs
      - run: node --check panel/src/Public/assets/admin/xcvm/horus-series.js
      - run: node panel/tests/Support/horus-series.mjs
      - run: php panel/tests/Support/horus-series.php
      - run: php panel/tests/Support/console-overview-smoke.php
      - run: find panel/src/Public/Views/admin panel/src/Public/Views/layouts panel/src/Public/Views/reseller -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: php tests/vendor-disconnect.php
      - run: php tests/independent-backups.php
      - run: python3 deployment/test_vendor_isolation.py
      - run: python3 deployment/test_horus_paths.py
      - run: python3 deployment/test_horus_home.py
      - run: python3 deployment/test_node_updates.py
      - run: python3 deployment/test_updates.py
      - run: sudo --preserve-env=GITHUB_ACTIONS python3 deployment/test_update_privileges.py
      - run: php tests/independent-updates.php
      - run: python3 deployment/test_packaging.py
      - run: python3 deployment/test_bootstrap.py
      - run: python3 deployment/test_node_tls.py
      - run: python3 deployment/test_native_agent.py
      - run: python3 -m compileall -q deployment
      - run: bash -n deployment/setup.sh
      - run: php -l deployment/provision-main.php && php -l deployment/enroll-node.php && php -l runtime/LocalCore.php
      - run: XCVM_LAB_STATE="$RUNNER_TEMP/xcvm-independent-lab/policy" php tests/deployment-policy.php
      - run: php tests/lb-install-guards.php

  native-controls:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - run: go test ./internal/clusteragent -run '^(TestNativeStream|TestSeedFanoutRecord|TestAgentChecksEveryCommand|TestARefusedCommandLeavesTheHighWater|TestAKillDoesNotWaitBehindASlowCommand)' -count=1
        working-directory: native/fanout
